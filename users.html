<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Banking - All Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: white; overflow-x: hidden; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        .gradient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            z-index: -3;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        /* Mobile Header */
        .mobile-header {
            display: none;
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 99;
            padding: 0 1rem;
            align-items: center;
            justify-content: space-between;
        }
        
        .hamburger-btn {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; font-size: 1.2rem;
        }
        
        /* Sidebar - ADMIN COLORS */
        .sidebar {
            width: 280px; height: 100vh;
            position: fixed; left: 0; top: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
            padding: 2rem;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }
        
        .sidebar-item {
            display: flex; align-items: center; gap: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 0.5rem;
        }
        
        .sidebar-item:hover, .sidebar-item.active {
            background: rgba(239, 68, 68, 0.1);
            color: white;
        }
        
        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.2));
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .main-content {
            margin-left: 280px;
            padding: 2rem;
            min-height: 100vh;
        }
        
        .sidebar-overlay {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            backdrop-filter: blur(4px);
        }
        
        .sidebar-overlay.show { display: block; }
        
        /* User Card - ADMIN COLORS */
        .user-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .user-card:hover {
            transform: translateY(-4px);
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 20px 40px rgba(239, 68, 68, 0.2);
        }
        
        .user-avatar {
            width: 52px; height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; font-weight: 700;
            flex-shrink: 0;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            flex-shrink: 0;
        }
        
        .status-active { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-inactive { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        
        .search-bar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            display: flex; align-items: center; gap: 0.75rem;
        }
        
        .search-bar input {
            background: transparent; border: none; outline: none;
            color: white; width: 100%;
        }
        
        .search-bar input::placeholder { color: rgba(255, 255, 255, 0.4); }
        
        /* ADMIN GRADIENT TEXT */
        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #ef4444 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* ADMIN BUTTON */
        .btn-admin {
            background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);
        }
        
        .btn-admin:hover {
            opacity: 0.9;
        }
        
        /* Toast */
        #toast {
            position: fixed; bottom: 6rem; right: 2rem;
            transform: translateY(20px); opacity: 0;
            transition: all 0.3s ease; z-index: 2000;
        }
        
        #toast.show { transform: translateY(0); opacity: 1; }
        
        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 12px;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Desktop Grid */
        .users-grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }
        
        /* Responsive */
        @media (max-width: 1280px) {
            .users-grid-container { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 1024px) {
            .mobile-header { display: flex; }
            .sidebar { transform: translateX(-100%); z-index: 101; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; padding-top: 80px; }
        }
        
        @media (max-width: 768px) {
            .users-grid-container { grid-template-columns: 1fr; }
            .user-avatar { width: 44px; height: 44px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    
    <!-- Mobile Header -->
    <div class="mobile-header">
        <div class="flex items-center gap-3">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center">
                    <i class="fas fa-shield-alt text-white text-sm"></i>
                </div>
                <div>
                    <span class="text-lg font-bold font-display">NEXUS</span>
                    <span class="ml-1 px-1.5 py-0.5 bg-gradient-to-r from-red-500 to-orange-500 text-white text-[10px] font-bold rounded">ADMIN</span>
                </div>
            </div>
        </div>
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center font-semibold text-sm" id="mobileUserAvatar">
            <i class="fas fa-user text-xs"></i>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center">
                <i class="fas fa-shield-alt text-white"></i>
            </div>
            <div>
                <span class="text-xl font-bold font-display">NEXUS</span>
                <span class="ml-1 px-2 py-0.5 bg-gradient-to-r from-red-500 to-orange-500 text-white text-xs font-bold rounded">ADMIN</span>
            </div>
        </div>

        <nav>
            <div class="sidebar-item" onclick="window.location.href='admin-dashboard.html'">
                <i class="fas fa-home w-5"></i>
                <span>Dashboard</span>
            </div>
            <div class="sidebar-item active">
                <i class="fas fa-users w-5"></i>
                <span>All Users</span>
            </div>
            <div class="sidebar-item" onclick="window.location.href='transactions.html'">
                <i class="fas fa-exchange-alt w-5"></i>
                <span>Transactions</span>
            </div>
            <div class="sidebar-item" onclick="window.location.href='analytics.html'">
                <i class="fas fa-chart-pie w-5"></i>
                <span>Analytics</span>
            </div>
        </nav>

        <div class="mt-auto pt-10">
            <div class="sidebar-item" onclick="window.location.href='settings.html'">
                <i class="fas fa-cog w-5"></i>
                <span>Settings</span>
            </div>
            <div class="sidebar-item" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt w-5"></i>
                <span>Logout</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold font-display mb-1">
                    All <span class="text-gradient">Users</span>
                </h1>
                <p class="text-gray-400" id="subtitle">Loading users...</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="search-bar flex-1 md:w-64">
                    <i class="fas fa-search text-gray-400"></i>
                    <input type="text" placeholder="Search users..." id="searchInput" oninput="filterUsers(this.value)">
                </div>
                <button class="px-4 py-3 rounded-xl btn-admin font-semibold text-sm transition-opacity whitespace-nowrap" onclick="refreshUsers()">
                    <i class="fas fa-sync-alt mr-2"></i>Refresh
                </button>
            </div>
        </header>

        <!-- Stats Summary -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="glass-card p-4">
                <p class="text-gray-400 text-sm">Total Users</p>
                <p class="text-2xl font-bold" id="statTotal">0</p>
            </div>
            <div class="glass-card p-4">
                <p class="text-gray-400 text-sm">Active</p>
                <p class="text-2xl font-bold text-green-400" id="statActive">0</p>
            </div>
            <div class="glass-card p-4">
                <p class="text-gray-400 text-sm">Total Balance</p>
                <p class="text-2xl font-bold text-orange-400" id="statBalance">$0</p>
            </div>
            <div class="glass-card p-4">
                <p class="text-gray-400 text-sm">New (7d)</p>
                <p class="text-2xl font-bold text-red-400" id="statRecent">0</p>
            </div>
        </div>

        <!-- Users Grid -->
        <div class="users-grid-container" id="usersGrid">
            <!-- Loading skeletons -->
            <div class="glass-card p-6 skeleton" style="height: 240px;"></div>
            <div class="glass-card p-6 skeleton" style="height: 240px;"></div>
            <div class="glass-card p-6 skeleton" style="height: 240px;"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <i class="fas fa-users-slash text-6xl text-gray-600 mb-4"></i>
            <p class="text-xl text-gray-400">No users found</p>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast">
        <div class="glass-card px-6 py-4 flex items-center gap-3">
            <i class="fas fa-check-circle text-green-400 text-xl"></i>
            <span id="toastMessage">Operation successful</span>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://okgkawqvnygwkosoqbqb.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rZ2thd3F2bnlnd2tvc29xYnFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyODA3MjgsImV4cCI6MjA5MTg1NjcyOH0.ctfeDvcXQ9OV8TvpsRKdgf7XLBxTHLouNfGn5_fHky8';
        
        let supabaseClient;
        let allUsers = [];
        let filteredUsers = [];
        
        try {
            supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        } catch (e) {
            console.error('Supabase init error:', e);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        async function checkAuth() {
            if (!supabaseClient) return false;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        async function loadUsers() {
            const isAuth = await checkAuth();
            if (!isAuth) return;

            showToast('Loading users...');

            try {
                const { data: users, error } = await supabaseClient
                    .from('user_profiles')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allUsers = users || [];
                filteredUsers = [...allUsers];
                
                renderUsers();
                updateStats();
                showToast(`Loaded ${allUsers.length} users`);

            } catch (err) {
                console.error('Error loading users:', err);
                showToast('Error loading users');
                allUsers = [
                    { id: '1', email: 'smartgliss60@gmail.com', full_name: 'Smart Gliss', balance: 5000, first_billing: 1000, second_billing: 2000, third_billing: 1500, fourth_billing: 500, status: 'active', created_at: '2026-04-17T10:00:00Z' },
                    { id: '2', email: 'obeleaustino@gmail.com', full_name: 'Obele Austin', balance: 24562, first_billing: 5000, second_billing: 8000, third_billing: 6000, fourth_billing: 5562, status: 'active', created_at: '2026-04-14T10:00:00Z' },
                    { id: '3', email: 'workbasehq@gmail.com', full_name: 'Work Base', balance: 12000, first_billing: 3000, second_billing: 4000, third_billing: 3000, fourth_billing: 2000, status: 'active', created_at: '2026-04-21T07:52:48Z' },
                    { id: '4', email: 'carilendbarbados@gmail.com', full_name: 'Carilend', balance: 0, first_billing: 0, second_billing: 0, third_billing: 0, fourth_billing: 0, status: 'active', created_at: '2026-04-22T10:00:00Z' }
                ];
                filteredUsers = [...allUsers];
                renderUsers();
                updateStats();
            }
        }

        function renderUsers() {
            const grid = document.getElementById('usersGrid');
            const emptyState = document.getElementById('emptyState');
            const subtitle = document.getElementById('subtitle');

            if (filteredUsers.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                subtitle.textContent = 'No users match your search';
                return;
            }

            emptyState.classList.add('hidden');
            subtitle.textContent = `${filteredUsers.length} user${filteredUsers.length !== 1 ? 's' : ''} found`;

            grid.innerHTML = filteredUsers.map(user => {
                const initials = getInitials(user.full_name || user.email);
                const createdDate = new Date(user.created_at).toLocaleDateString();
                const totalBillings = (user.first_billing || 0) + (user.second_billing || 0) + (user.third_billing || 0) + (user.fourth_billing || 0);
                
                return `
                    <div class="glass-card user-card p-6" onclick="viewUserDetail('${user.id}')">
                        <!-- Header: Avatar + Info + Status -->
                        <div class="flex items-start justify-between mb-5">
                            <div class="flex items-center gap-4 min-w-0">
                                <div class="user-avatar">${initials}</div>
                                <div class="min-w-0">
                                    <h3 class="font-semibold text-lg truncate" title="${user.full_name || 'No Name'}">${user.full_name || 'No Name'}</h3>
                                    <p class="text-sm text-gray-400 truncate" title="${user.email}">${user.email}</p>
                                </div>
                            </div>
                            <span class="status-badge status-${user.status || 'active'} ml-3">${user.status || 'active'}</span>
                        </div>
                        
                        <!-- Financial Info -->
                        <div class="space-y-3 mb-5">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400 text-sm">Balance</span>
                                <span class="font-semibold text-green-400">$${parseFloat(user.balance || 0).toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400 text-sm">Total Billings</span>
                                <span class="font-semibold text-orange-400">$${totalBillings.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400 text-sm">Joined</span>
                                <span class="text-gray-300 text-sm">${createdDate}</span>
                            </div>
                        </div>
                        
                        <!-- 4 Billings Grid -->
                        <div class="grid grid-cols-4 gap-2 pt-4 border-t border-white/10">
                            <div class="text-center">
                                <p class="text-[10px] text-gray-500 mb-1">1st</p>
                                <p class="text-sm font-medium text-red-400">$${parseFloat(user.first_billing || 0).toLocaleString()}</p>
                            </div>
                            <div class="text-center border-l border-white/5">
                                <p class="text-[10px] text-gray-500 mb-1">2nd</p>
                                <p class="text-sm font-medium text-orange-400">$${parseFloat(user.second_billing || 0).toLocaleString()}</p>
                            </div>
                            <div class="text-center border-l border-white/5">
                                <p class="text-[10px] text-gray-500 mb-1">3rd</p>
                                <p class="text-sm font-medium text-yellow-400">$${parseFloat(user.third_billing || 0).toLocaleString()}</p>
                            </div>
                            <div class="text-center border-l border-white/5">
                                <p class="text-[10px] text-gray-500 mb-1">4th</p>
                                <p class="text-sm font-medium text-pink-400">$${parseFloat(user.fourth_billing || 0).toLocaleString()}</p>
                            </div>
                        </div>
                        
                        <!-- Footer -->
                        <div class="mt-4 pt-3 border-t border-white/5 text-center">
                            <span class="text-sm text-red-400 flex items-center justify-center gap-2 hover:text-orange-400 transition-colors">
                                View Full Details <i class="fas fa-arrow-right text-xs"></i>
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const total = allUsers.length;
            const active = allUsers.filter(u => u.status === 'active').length;
            const totalBalance = allUsers.reduce((sum, u) => sum + parseFloat(u.balance || 0), 0);
            
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            const recent = allUsers.filter(u => new Date(u.created_at) >= sevenDaysAgo).length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statActive').textContent = active;
            document.getElementById('statBalance').textContent = '$' + totalBalance.toLocaleString();
            document.getElementById('statRecent').textContent = recent;
        }

        function filterUsers(query) {
            const lower = query.toLowerCase();
            filteredUsers = allUsers.filter(user => 
                (user.full_name || '').toLowerCase().includes(lower) ||
                (user.email || '').toLowerCase().includes(lower) ||
                (user.status || '').toLowerCase().includes(lower)
            );
            renderUsers();
        }

        function viewUserDetail(userId) {
            window.location.href = `user-detail.html?id=${userId}`;
        }

        async function refreshUsers() {
            await loadUsers();
        }

        async function handleLogout() {
            if (!confirm('Logout?')) return;
            if (supabaseClient) await supabaseClient.auth.signOut();
            localStorage.clear();
            window.location.href = 'index.html';
        }

        function getInitials(name) {
            if (!name) return 'U';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            if (msg) msg.textContent = message;
            if (toast) {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 1024) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('show');
            }
        });
    </script>
</body>
</html>
